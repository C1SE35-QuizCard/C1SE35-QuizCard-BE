plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.codegym'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.spring.io/release' }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client:4.0.2'
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.4.4'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.passay:passay:1.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.security:spring-security-messaging'
//    http://mvnrepository.com/artifact/org.springframework.security/spring-security-jwt
    implementation group: 'org.springframework.security', name: 'spring-security-jwt', version: '1.1.1.RELEASE'
//    http://mvnrepository.com/artifact/io.jsonwebtoken/jjwt
    implementation group: 'io.jsonwebtoken', name: 'jjwt', version: '0.12.5'
// https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-impl
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.12.5'
// https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-api
    implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.12.5'
// https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-jackson
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.12.5'
// https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-websocket
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: '3.3.1'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'com.stripe:stripe-java:22.20.0'

    implementation 'com.github.axet:java-flac-encoder:0.3.8'
// https://mvnrepository.com/artifact/com.github.goxr3plus/java-google-speech-api
    implementation group: 'com.github.goxr3plus', name: 'java-google-speech-api', version: 'V2.1'

    implementation 'javazoom:jlayer:1.0.1'


    implementation 'org.springframework.boot:spring-boot-starter-hateoas'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'

    implementation 'org.mapstruct:mapstruct:1.5.2.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.2.Final'

    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.1'
    implementation 'io.github.openfeign.form:feign-form-spring:3.8.0'

    // Spring Data Reactive MongoDB
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'

    // Spring WebFlux
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation 'nl.martijndwars:web-push:5.1.1'

    implementation 'com.ibm.icu:icu4j:74.1'
    // Dependency Cache
    implementation 'org.springframework.boot:spring-boot-starter-cache:3.3.2'

    // Dependency Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.3.2'

    // Dependency chính cho Spring Kafka (runtime)
    implementation 'org.springframework.kafka:spring-kafka:3.2.4'

    implementation 'org.hibernate.orm:hibernate-envers'

    // Dependency cho testing (chỉ dùng trong kiểm thử)
    testImplementation 'org.springframework.kafka:spring-kafka-test:3.2.4'

    // Caffeine cache
    implementation 'com.github.ben-manes.caffeine:caffeine:2.8.8'

    // Xử lý các loại tài liệu
    implementation 'org.apache.poi:poi:4.1.2'
    implementation 'org.apache.poi:poi-ooxml:4.1.2'
    implementation 'org.apache.pdfbox:pdfbox:2.0.24'
    implementation 'org.apache.pdfbox:pdfbox-tools:2.0.24'

    // Itextpdf - xử lý PDF bảo mật
    implementation 'com.itextpdf:itextpdf:5.5.13.2'

    // Apache Tika - tự động nhận diện loại tài liệu
    implementation 'org.apache.tika:tika-core:1.24.1'
    implementation 'org.apache.tika:tika-parsers:1.24.1'

    // Thư viện để tích hợp với OpenAI API
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Tesseract OCR
    implementation 'net.sourceforge.tess4j:tess4j:4.5.4'

    implementation 'com.github.lkienkle11:shared-common-classes:v0.+'

    implementation 'com.google.cloud:google-cloud-texttospeech:2.6.0'

    // Lombok để giảm mã soạn thảo
    compileOnly 'org.projectlombok:lombok:1.18.20'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
}


tasks.named('test') {
    useJUnitPlatform()
}
